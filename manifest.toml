#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "tinyfeed"
name = "Tinyfeed"
description.en = "Generate a static HTML page from a collection of feeds"
description.fr = "Générer une page HTML statique à partir d'un ensemble de flux"

version = "1.4.1~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "MIT"
website = "https://feed.lovergne.dev/"
demo = "https://feed.lovergne.dev/demo/"
admindoc = "https://feed.lovergne.dev/"
code = "https://github.com/TheBigRoomXXL/tinyfeed"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/tinyfeed"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources]

    [resources.sources.main]
    rename = "tinyfeed"
    in_subdir = false
    extract = false
    amd64.url = "https://github.com/TheBigRoomXXL/tinyfeed/releases/download/v1.4.1/tinyfeed_linux_amd64"
    amd64.sha256 = "119328eee2113c2241ad43c0f95afbe8608922bcacf61de642e06f8c77b6e081"
    arm64.url = "https://github.com/TheBigRoomXXL/tinyfeed/releases/download/v1.4.1/tinyfeed_linux_arm64"
    arm64.sha256 = "119328eee2113c2241ad43c0f95afbe8608922bcacf61de642e06f8c77b6e081"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "tinyfeed_linux_amd64"
    autoupdate.asset.arm64 = "tinyfeed_linux_arm64"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
